<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Learn about SkyNest Co-Living Spaces, a modern co-living company in Singapore offering flexible accommodation for young professionals, digital nomads, and international students.">

  <title>SkyNest Co-Living Spaces | About Us</title>

  <!-- Embedded CSS -->
  <style>
    /* General settings */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      color: #362e1e;
      background-color: #fdfbf2;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Keyboard accessibility */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 12px;
      padding: 10px;
      background-color: #ffffff;
      color: #3d3115;
      z-index: 10;
    }

    .skip-link:focus {
      top: 12px;
    }

    a:focus-visible {
      outline: 3px solid #9e7614;
      outline-offset: 4px;
    }

    /* Header */
    header {
      padding: 24px 0;
      background-color: #f3e5ab;
      color: #3d3115;
      text-align: center;
      border-bottom: 2px solid #d4bc6a;
    }

    .site-name {
      margin: 0;
      font-size: 30px;
      font-weight: bold;
      color: #2c220c;
    }

    .tagline {
      margin: 5px 0 0;
      color: #544522;
    }

    /* Navigation */
    nav {
      background-color: #e8d48b;
      border-bottom: 1px solid #d4bc6a;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      list-style: none;
      margin: 0;
      padding: 12px 0;
    }

    .nav-links a {
      display: block;
      padding: 10px 16px;
      border-radius: 5px;
      color: #2c220c;
      text-decoration: none;
      font-weight: bold;
    }

    .nav-links a:hover,
    .nav-links a[aria-current="page"] {
      background-color: #5c4818;
      color: #fdfbf2;
    }

    /* Introduction */
    .page-intro {
      padding: 48px 0;
      background-color: #f9f1cf;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #785b18;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 38px;
      line-height: 1.2;
      color: #2c220c;
    }

    h2 {
      margin-top: 0;
      font-size: 28px;
      line-height: 1.3;
      color: #2c220c;
    }

    h3 {
      margin-top: 0;
      color: #2c220c;
    }

    .intro-text {
      max-width: 800px;
    }

    /* Content layout */
    .section {
      padding: 48px 0;
    }

    .white-section {
      background-color: #ffffff;
    }

    .two-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    .information-box {
      padding: 26px;
      background-color: #f9f1cf;
      border: 1px solid #e6d598;
      border-left: 4px solid #8a691b;
      border-radius: 10px;
    }

    .information-box p:last-child {
      margin-bottom: 0;
    }

    /* Lounge image */
    .about-photo {
      margin: 0;
    }

    .about-photo img {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      margin: 0 auto;
      border-radius: 12px;
      border: 1px solid #e6d598;
    }

    .about-photo figcaption {
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
      color: #5c4e2e;
    }

    /* Cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 24px;
    }

    .card {
      padding: 24px;
      background-color: #ffffff;
      border: 1px solid #e6d598;
      border-top: 4px solid #d4bc6a;
      border-radius: 10px;
    }

    .card p:last-child {
      margin-bottom: 0;
    }

    .card ul {
      padding-left: 20px;
      margin-bottom: 0;
    }

    .card li {
      margin-bottom: 8px;
    }

    /* Buttons */
    .button {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 22px;
      border-radius: 6px;
      background-color: #6e5415;
      color: #ffffff;
      font-weight: bold;
      text-decoration: none;
    }

    .button:hover {
      background-color: #4f3b0d;
    }

    /* Enquiry section */
    .enquiry {
      padding: 38px 24px;
      background-color: #f9f1cf;
      border: 1px solid #e6d598;
      border-radius: 12px;
      text-align: center;
    }

    .enquiry p {
      max-width: 750px;
      margin: 0 auto 12px;
    }

    /* Footer */
    footer {
      padding: 26px 0;
      background-color: #f3e5ab;
      color: #3d3115;
      text-align: center;
      border-top: 2px solid #d4bc6a;
    }

    footer p {
      margin: 5px 0;
    }

    .footer-note {
      font-size: 14px;
      color: #544522;
    }

    /* Mobile and tablet screens */
    @media (max-width: 768px) {
      .two-columns,
      .cards {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 30px;
      }

      .site-name {
        font-size: 26px;
      }

      .page-intro,
      .section {
        padding: 32px 0;
      }

      .nav-links a {
        padding: 10px 12px;
      }
    }
  </style>
</head>
